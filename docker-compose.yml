# ═══════════════════════════════════════════════════════════════
# RagChat — stack em um compose
# ═══════════════════════════════════════════════════════════════
#
# Uso:  docker compose up -d --build   (ou .\setup.ps1 na 1ª vez)
#
# 🚨 ESTE ARQUIVO SOZINHO É O DEV DA ESTAÇÃO. A VPS (rag.disroy.org)
#    aplica POR CIMA o override de produção — SEM ele o container nasce
#    pela metade (502 no ar: rota traefik por nome sem rede; porta 8001
#    exposta; hf_cache/models sem volume; env de túnel vencida pelo
#    host.docker.internal). Na VPS, SEMPRE:
#      docker compose -p rag-chat -f docker-compose.yml \
#        -f ~/infra/services/rag-chat/docker-compose.prod.yml up -d --build
#
# Serviços:
#   api      :8001→8000       (FastAPI + webui; jobs rodam no executor
#                             async IN-PROCESS — sem broker)
#   sandbox  (rede interna)   (teste de código do chat)
#
# ⚠️ QDRANT EXTERNO: o fork USA a instância do rag-llama que já roda no
# host (:6333, dados em rag-llama/qdrant_data) — as coleções existentes
# aparecem sozinhas. Nenhum qdrant neste compose (decisão do dono).
#
# Redis/RabbitMQ REMOVIDOS (decisão do dono 27/08): jobs no executor
# asyncio em memória, contadores em logs/uso_llm.jsonl, cache semântico
# deu lugar à bússola (Qdrant) — nada de broker/cache externos.
#
# Os MODELOS (llama-server GPU) rodam NO HOST — servicos_llm.py — e a
# API os alcança por host.docker.internal. Troca de modelo segue no
# modo host (guards avisam).

services:
  api:
    build: .
    container_name: ragchat-api
    ports:
      - "8001:8000"
    environment:
      # infra do HOST (VENDE o .env montado — config usa override=False
      # em container justamente por isso)
      RAGAROY_CONTAINER: "1"
      QDRANT_URL: http://host.docker.internal:6333
      # modelos no HOST (GPU/binários locais — servicos_llm.py)
      LLM_BASE_URL: http://host.docker.internal:8090/v1
      EMBED_BASE_URL: http://host.docker.internal:8081/v1
      # GGUFs visíveis no container (listagem/tamanhos) — read-only;
      # pasta dos modelos configurável no .env (MODELS_DIR)
      MODELS_DIR: /models
      # agente do HOST (:8010) faz as operações de GPU (troca de modelo,
      # garantir embedding) que o container não pode. Local usa o host
      # direto; a VPS aponta para o TÚNEL do agente via .env —
      # com AGENTE_TOKEN (mesmo valor dos dois lados) quando público.
      AGENTE_HOST_URL: ${AGENTE_HOST_URL:-http://host.docker.internal:8010}
      AGENTE_TOKEN: ${AGENTE_TOKEN:-}
      # sandbox de execução (testa códigos do chat; rede interna, sem porta)
      SANDBOX_URL: ${SANDBOX_URL:-http://sandbox:8020}
      SANDBOX_TOKEN: ${SANDBOX_TOKEN:-}
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      # modelos: só leitura (o agente no host é quem ergue/servi os GGUFs);
      # pasta configurável no .env — ex.: MODELS_DIR=D:/models (Windows)
      # ou /home/user/models (Linux). Default local: ./models
      - ${MODELS_DIR:-./models}:/models:ro
      # cache do HuggingFace do reranker (bge-reranker-base ~1,1 GB) — sem
      # o volume, todo rebuild/boot baixa de novo. CAMINHO DO USUÁRIO da
      # imagem (ragchat, não-root): é onde as libs HF gravam de verdade
      - ./hf_cache:/home/ragchat/.cache/huggingface
      # estado persistente no HOST (mesmos caminhos do modo host)
      - ./.env:/app/.env
      - ./users.json:/app/users.json
      - ./usuarios_permitidos.txt:/app/usuarios_permitidos.txt
      - ./mcp_servers.json:/app/mcp_servers.json
      - ./mcp_conhecidos.json:/app/mcp_conhecidos.json
      - ./sessions:/app/sessions
      - ./saidas:/app/saidas
      - ./logs:/app/logs
      - ./datasets:/app/datasets
    restart: unless-stopped

  # ═══ SANDBOX: executa os códigos do chat para TESTE (multi-linguagem:
  # dotnet/java/rust/ruby/php/go/node/python/dart). Sempre ativo, SEM
  # porta publicada (só rede interna), usuário não-root, arquivos em
  # /tmp/work (efêmero de propósito — cada teste é autossuficiente).
  sandbox:
    build: ./sandbox
    container_name: ragchat-sandbox
    environment:
      SANDBOX_TOKEN: ${SANDBOX_TOKEN:-}
    restart: unless-stopped
