# CI — validação em develop e main (deploy NÃO é por aqui)
# O deploy do fork é pelo infra (compose na VPS/estação, stacks visíveis no
# Portainer paas.disroy.org) — os jobs cd/cd-dev do rag-llama foram removidos
# para não deployarem paths legados na VPS.
name: ci

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [develop, main]
  workflow_dispatch: {}

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ci:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Sintaxe Python
        run: |
          python -m py_compile $(find . -name "*.py" -not -path "./.git/*" -not -path "*/node_modules/*" -not -path "./webui/*") || true
          echo "CI ok"

  # scripts genéricos precisam valer em TODOS os sistemas operacionais
  # (o usuário pode rodar em Windows, Linux ou macOS)
  ci-multi-os:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Sintaxe do servicos_llm.py
        run: python -m py_compile servicos_llm.py
      - name: Modo não-interativo (sem MODELS_DIR)
        shell: python
        run: |
          import subprocess, sys
          r = subprocess.run([sys.executable, "servicos_llm.py", "--listar"],
                             capture_output=True, text=True, input="")
          print(r.stdout, r.stderr)
          # sem MODELS_DIR e sem terminal: sai com instrução clara (não trava)
          assert r.returncode == 1 and "MODELS_DIR" in (r.stdout + r.stderr)
